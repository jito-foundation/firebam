[net.socket]
receive_buffer_size = 16777216
send_buffer_size = 16777216

[gossip]
entrypoints = [
    "entrypoint.mainnet-beta.solana.com:8001",
    "entrypoint2.mainnet-beta.solana.com:8001",
    "entrypoint3.mainnet-beta.solana.com:8001",
    "entrypoint4.mainnet-beta.solana.com:8001",
    "entrypoint5.mainnet-beta.solana.com:8001",
]

[paths]
base = "/home/{user}/.firedancer/{name}"
identity_key = "/etc/solana/identity.json"
vote_account = "/etc/solana/vote-account.json"
authorized_voter_paths = ["/etc/solana/staked-identity.json"]
genesis = "/solana/ledger/genesis.bin"
accounts = "/solana/accounts/accounts.db"

[consensus]
expected_genesis_hash = "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d"

[snapshots]
genesis_download = true
incremental_snapshots = true
max_retry_abort = 100
min_download_speed_mibs = 195

[snapshots.sources]
#servers = ["http://api.mainnet-beta.solana.com:80"]

[accounts]
file_size_gib = 600
max_accounts = 1_600_000_000

[log]
level_logfile = "NOTICE"

[development]
    core_dump = true

[tiles.rpc]
enabled = true
rpc_listen_address = "127.0.0.1"
rpc_listen_port = 8899

[tiles.bundle]
enabled = true
url = "https://mainnet.block-engine.jito.wtf"
tip_distribution_program_addr = "4R3gSG8BpU4t19KYj8CfnbtRpnT8gtk4dvTHxVRwc2r7"
tip_payment_program_addr = "T1pyyaTNZsKv2WcRAB8oVnk93mLJw2XzjtVYqCsaHqt"
tip_distribution_authority = "8F4jGUmxF36vQ6yabnsxX6AQVXdKBhs8kGSUuRKSg8Xt"

[tiles.bam]
enabled = true
url = "http://mainnet.bam.jito.wtf:50055"

[tiles.gui]
gui_listen_address = "0.0.0.0"
