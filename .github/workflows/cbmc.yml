name: CBMC Proofs
on:
  pull_request:

jobs:
  check-cbmc:
    if: github.repository == 'firedancer-io/firedancer'
    runs-on: [self-hosted, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Proofs
        run: |
          cbmc --version
          make -j proof
        shell: bash
