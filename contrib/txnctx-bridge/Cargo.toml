[package]
name = "txnctx-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
prost = "0.13.4"
bincode = "1.3"
base64 = "0.22"
solana-compute-budget-interface = "3.0"
solana-address-lookup-table-interface = { version = "3.0", features = ["bincode"] }
solana-hash = "3.0"
solana-instruction = "3.0"
solana-keypair = "3.0"
solana-message = "3.0"
solana-pubkey = "3.0"
solana-signature = "3.0"
solana-signer = "3.0"
solana-slot-hashes = { version = "3.0", features = ["serde"] }
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-transaction = { version = "3.0", features = ["bincode", "serde"] }
solana-vote-interface = { version = "3.0", features = ["bincode"] }

[build-dependencies]
protobuf-src = "1.1.0"
prost-build = "0.13.4"
