description = "Send one benign batch, close the scheduler stream, and rely on validator reconnect."
heartbeat_interval_ms = 1000
replay_on_reconnect = false

[[events]]
type = "sleep"
ms = 1000

[[events]]
type = "send_batch"
seq_id = 1
packet_count = 5
max_schedule_slot = "max"
revert_on_error = true
simple_vote_tx = false
cu_per_tx = 1000000

[[events]]
type = "sleep"
ms = 750

[[events]]
type = "close_stream"
