description = "Delay the first auth RPC beyond the validator deadline, then prove recovery with a terminal batch result."
heartbeat_interval_ms = 1000
resume_on_reconnect = true
auth_delay_ms_sequence = [10000]

[[events]]
type = "sleep"
ms = 1000

[[events]]
type = "send_batch"
seq_id = 4242005
packet_count = 1
max_schedule_slot = "max"
revert_on_error = true
simple_vote_tx = false

[[events]]
type = "wait_inbound"
kind = "batch_result"
min_count = 1
timeout_ms = 30000
